server:
  port: 8080

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 3s
  codec:
    max-in-memory-size: 16MB
  cloud:
    gateway:
      routes:
        # 更具体的路由须写在 /v1/** 之前
        - id: billing-v1-usage
          uri: ${TOKENS_GATEWAY_BILLING_URI:http://127.0.0.1:8103}
          predicates:
            - Path=/v1/usage
        - id: billing-apikeys
          uri: ${TOKENS_GATEWAY_BILLING_URI:http://127.0.0.1:8103}
          predicates:
            - Path=/apikeys,/apikeys/**
        - id: billing-dashboard
          uri: ${TOKENS_GATEWAY_BILLING_URI:http://127.0.0.1:8103}
          predicates:
            - Path=/dashboard/**
        - id: billing-account-orders
          uri: ${TOKENS_GATEWAY_BILLING_URI:http://127.0.0.1:8103}
          predicates:
            - Path=/billing/**
        - id: payment-payments
          uri: ${TOKENS_GATEWAY_PAYMENT_URI:http://127.0.0.1:8104}
          predicates:
            - Path=/payments/**
        - id: ops-console
          uri: ${TOKENS_GATEWAY_OPS_URI:http://127.0.0.1:8105}
          predicates:
            - Path=/ops/**
        - id: adapter-v1
          uri: ${TOKENS_GATEWAY_ADAPTER_URI:http://127.0.0.1:8102}
          predicates:
            - Path=/v1/**
        - id: user-center
          uri: ${TOKENS_GATEWAY_USER_URI:http://127.0.0.1:8101}
          predicates:
            - Path=/user/**
      # 本版本 Gateway 将 connect-timeout / response-timeout 绑定为 Integer（毫秒）。
      httpclient:
        connect-timeout: 15000
        response-timeout: ${TOKENS_GATEWAY_RESPONSE_TIMEOUT:600000}

tokenhub:
  gateway:
    billing-base-url: ${TOKENS_GATEWAY_BILLING_URI:http://127.0.0.1:8103}
    internal-token: ${BILLING_INTERNAL_TOKEN:dev-internal-token}
    rate-limit-per-second: ${GATEWAY_RATE_LIMIT_PER_SECOND:60}
    apikey-cache:
      enabled: ${GATEWAY_APIKEY_CACHE_ENABLED:false}
      positive-ttl-seconds: ${GATEWAY_APIKEY_CACHE_POS_TTL:60}
      negative-ttl-seconds: ${GATEWAY_APIKEY_CACHE_NEG_TTL:10}
    risk:
      enabled: ${GATEWAY_RISK_ENABLED:false}
      enforce-allowlist: ${GATEWAY_RISK_ENFORCE_ALLOWLIST:false}
      daily-quota: ${GATEWAY_RISK_DAILY_QUOTA:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: gateway-service
