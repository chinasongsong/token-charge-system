server:
  port: 8102

spring:
  application:
    name: adapter-service
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${MYSQL_JDBC_URL:jdbc:mysql://127.0.0.1:3306/token_charge?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

tokenhub:
  adapter:
    provider-code: deepseek
    # 与 DeepSeek 官方 OpenAI 兼容 API 的 model 字段一致（见 api-docs.deepseek.com）
    default-chat-model: deepseek-v4-flash
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    deepseek-base-url-fallback: ${DEEPSEEK_BASE_URL_FALLBACK:https://api.deepseek.com}
    failover-enabled: ${ADAPTER_FAILOVER_ENABLED:true}
    zhipu-provider-code: zhipu
    zhipu-api-key: ${ZHIPU_API_KEY:}
    zhipu-base-url-fallback: ${ZHIPU_BASE_URL_FALLBACK:https://open.bigmodel.cn/api/paas/v4}
    zhipu-default-chat-model: glm-4-flash
    routing:
      weight-deepseek: ${ROUTING_WEIGHT_DEEPSEEK:70}
      weight-zhipu: ${ROUTING_WEIGHT_ZHIPU:30}
    idempotency-cache:
      enabled: ${ADAPTER_IDEMPOTENCY_CACHE_ENABLED:true}
      ttl-seconds: ${ADAPTER_IDEMPOTENCY_CACHE_TTL:86400}
      lock-ttl-seconds: ${ADAPTER_IDEMPOTENCY_LOCK_TTL:120}
      wait-ms: ${ADAPTER_IDEMPOTENCY_WAIT_MS:30000}
  billing:
    settlement-enabled: ${BILLING_SETTLEMENT_ENABLED:true}
    base-url: ${TOKENS_GATEWAY_BILLING_URI:http://127.0.0.1:8103}

resilience4j:
  circuitbreaker:
    instances:
      deepseek:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
  retry:
    instances:
      deepseek:
        maxAttempts: 2
        waitDuration: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
