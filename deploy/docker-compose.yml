# 与本仓库同行的 Compose 骨架：基础设施先行，应用服务在多模块落地后追加。
# 使用方式（仓库根目录）：docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d

services:
  mysql:
    image: mysql:8.0
    container_name: token-charge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-token_charge}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]

  redis:
    image: redis:7-alpine
    container_name: token-charge-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # 示例占位：网关与各业务服务在多模块工程就绪后取消注释并指向本仓 Dockerfile
  # gateway-service:
  #   build:
  #     context: ../gateway-service
  #     dockerfile: Dockerfile
  #   depends_on:
  #     - mysql
  #     - redis

volumes:
  mysql_data:
  redis_data:
